[project]
name = "oriade-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "argon2-cffi>=23.1", "redis>=5,<7", "celery>=5.4,<6", "email-validator>=2", "boto3>=1.37", "pillow>=11", "python-multipart>=0.0.20", "sentry-sdk[fastapi]>=2", "opentelemetry-instrumentation-fastapi>=0.51b0"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.hatch.build.targets.wheel]
packages = ["src/oriade"]
