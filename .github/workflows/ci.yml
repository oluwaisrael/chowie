name: Validate Óriade
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oriade
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oriade_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U oriade"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql+psycopg://oriade:test-password@localhost:5432/oriade_test
      TEST_DATABASE_URL: postgresql+psycopg://oriade:test-password@localhost:5432/oriade_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1', python-version: '3.13'}
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run alembic upgrade head && uv run alembic check && uv run pytest -q && uv run ruff check src tests && uv run ruff format --check src tests migrations
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '11.11.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
